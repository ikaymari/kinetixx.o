services:
  - type: web
    name: kinetix-org-ikaymari
    runtime: docker
    plan: 0.5c-512mb
    dockerContext: ./kinetix
    dockerfilePath: ./kinetix/Dockerfile
    healthCheckPath: /health
    disk:
      name: kinetix-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: KINETIX_DATA_PATH
        value: /var/data
      - key: KINETIX_ADMIN_USERNAME
        sync: false
      - key: KINETIX_ADMIN_PASSWORD
        sync: false
