<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#F4845F}
body{font-family:'Inter',sans-serif;color:#fff}
#root{position:relative;width:100%;height:100%;overflow:hidden;transition:background-color 650ms cubic-bezier(.4,0,.2,1)}
.abs{position:absolute}
#grain{inset:0;z-index:50;pointer-events:none;opacity:.4;background-size:200px 200px;background-repeat:repeat;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.08'/></svg>")}
#ghost{left:0;right:0;top:18%;z-index:2;display:flex;justify-content:center;pointer-events:none;user-select:none;font-family:'Anton',sans-serif;font-size:clamp(90px,24vw,340px);font-weight:900;line-height:1;text-transform:uppercase;letter-spacing:-.02em;white-space:nowrap;transition:opacity 325ms ease}
#brand{top:calc(24px + env(safe-area-inset-top,0px));left:16px;z-index:60;font-size:12px;font-weight:600;text-transform:uppercase;opacity:.9;letter-spacing:.18em}
#stage{inset:0;z-index:3}
.item{position:absolute;aspect-ratio:.6/1;will-change:transform,filter,opacity;transition:transform 650ms cubic-bezier(.4,0,.2,1),filter 650ms cubic-bezier(.4,0,.2,1),opacity 650ms cubic-bezier(.4,0,.2,1),left 650ms cubic-bezier(.4,0,.2,1)}
.item img{width:100%;height:100%;object-fit:contain;object-position:bottom center;display:block;-webkit-user-drag:none;filter:drop-shadow(0 18px 22px rgba(0,0,0,.22))}
#info{left:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;max-width:320px}
#info h2{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;opacity:.95;margin-bottom:8px}
#info p{display:none;font-size:14px;line-height:1.6;opacity:.85;margin-bottom:20px}
.btns{display:flex;gap:12px}
.btn{width:48px;height:48px;border-radius:50%;background:transparent;border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 150ms,background-color 150ms}
.btn:hover{transform:scale(1.08);background:rgba(255,255,255,.12)}
.btn:focus-visible,#cta:focus-visible{outline:3px solid #fff;outline-offset:3px}
#cta{right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:6px;font-family:'Anton',sans-serif;font-size:clamp(20px,4vw,56px);font-weight:400;color:#fff;opacity:.95;transition:opacity 200ms;letter-spacing:-.02em;line-height:1;text-transform:uppercase;text-decoration:none}
#cta:hover{opacity:1}
#cta svg{width:20px;height:20px}
@media(min-width:640px){
 #brand{left:32px}
 #info{left:96px;bottom:80px}
 #info h2{font-size:22px;margin-bottom:12px}
 #info p{display:block}
 .btn{width:64px;height:64px}
 #cta{right:40px;bottom:80px}
 #cta svg{width:32px;height:32px}
}
@media(prefers-reduced-motion:reduce){.item,#root,#ghost{transition-duration:1ms!important}}
</style></head><body>
<div id="root"><div style="position:relative;width:100%;height:100vh;overflow:hidden" id="hero">
<div id="grain" class="abs"></div>
<div id="ghost" class="abs"></div>
<div id="brand" class="abs">Product selection</div>
<div id="stage" class="abs"></div>
<div id="info" class="abs"><h2 id="name"></h2><p id="desc"></p>
<div class="btns">
<button class="btn" id="prev" aria-label="Previous product"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
<button class="btn" id="next" aria-label="Next product"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
</div></div>
<a id="cta" class="abs" href="#shop">Shop now <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
</div></div>

let active=0,lock=false,mobile=innerWidth<640;
const root=document.getElementById('root'),stage=document.getElementById('stage'),ghost=document.getElementById('ghost');
const items=P.map(p=>{const d=document.createElement('div');d.className='item';const i=new Image();i.src=p.src;i.draggable=false;i.alt=p.name;d.appendChild(i);stage.appendChild(d);return d});
function role(i){const d=(i-active+4)%4;return ['center','right','back','left'][d]}
function render(){
 const m=mobile;
 items.forEach((el,i)=>{
  const r=role(i),s=el.style;
  s.zIndex={center:20,left:10,right:10,back:5}[r];
  if(r==='center'){s.transform=`translateX(-50%) scale(${m?1.25:1.68})`;s.filter='blur(0)';s.opacity=1;s.left='50%';s.height=m?'60%':'92%';s.bottom=m?'22%':'0'}
  else{s.transform='translateX(-50%) scale(1)';s.bottom=m?'32%':'12%';
   if(r==='back'){s.filter='blur(4px)';s.opacity=1;s.left='50%';s.height=m?'13%':'22%'}
   else{s.filter='blur(2px)';s.opacity=.85;s.height=m?'16%':'28%';s.left=r==='left'?(m?'20%':'30%'):(m?'80%':'70%')}}
  el.setAttribute('aria-hidden',r!=='center');
 });
 root.style.backgroundColor=P[active].bg;
 document.getElementById('name').textContent=P[active].name;
 document.getElementById('desc').textContent=P[active].desc;
 ghost.style.opacity=0;setTimeout(()=>{ghost.textContent=P[active].ghost;ghost.style.opacity=1},325);
}
function nav(d){if(lock)return;lock=true;active=d==='next'?(active+1)%4:(active+3)%4;render();setTimeout(()=>lock=false,650)}
document.getElementById('next').onclick=()=>nav('next');
document.getElementById('prev').onclick=()=>nav('prev');
addEventListener('keydown',e=>{if(e.key==='ArrowRight')nav('next');if(e.key==='ArrowLeft')nav('prev')});
addEventListener('resize',()=>{mobile=innerWidth<640;render()});
ghost.textContent=P[0].ghost;render();
</script></body></html>
